<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TruthTrace | Claim desk</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body><header><div class="brand"><i aria-hidden="true">T</i>TruthTrace</div><span>TruthTracers · PE-B25-30</span></header><main>
<p class="kicker">Verification workspace</p><h1>Claim desk<span>.</span></h1><p class="intro">Compare a claim with its sources and inspect the evidence behind the verdict.</p>
<nav aria-label="Workspace mode"><button id="demo" aria-pressed="true">Example cases</button><button id="live" aria-pressed="false">Check a claim</button></nav>
<div class="grid"><section><div id="chooser"><label for="case">Example case</label><select id="case"></select></div><form id="form"><label for="claim">Claim</label><textarea id="claim" required minlength="5" maxlength="1500" rows="3"></textarea>
<div id="sources"></div><button id="add" type="button" hidden>Add source</button><p id="hint"></p><button class="primary" id="submit">View assessment</button></form></section>
<section class="report" aria-live="polite"><p class="kicker">Evidence review</p><h2>Assessment</h2><div id="result">Choose a case and select View assessment to see its verdict and supporting passages.</div></section></div>
</main><template id="source"><fieldset><legend></legend><label>Source name<input class="name" maxlength="150" required></label><label class="urlrow">Source URL (optional)<input class="url" maxlength="500" type="url"></label><label>Source passage<textarea class="passage" required minlength="10" maxlength="15000" rows="4"></textarea></label><button type="button" class="remove">Remove source</button></fieldset></template></body></html>
